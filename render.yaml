services:
  - type: web
    name: fabrica-tejas-app
    runtime: python
    buildCommand: pip install -r requirements.txt
    # La migración se ejecuta antes de atender tráfico. Así, el código y el
    # esquema de producción se despliegan como una misma versión.
    startCommand: flask --app app db upgrade && gunicorn app:app --bind 0.0.0.0:$PORT
